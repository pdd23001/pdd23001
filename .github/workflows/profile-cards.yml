name: Generate profile summary cards

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-cards
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # Pinned to the release branch head as of 2026-08-15 (v0.12.0).
      # Bump deliberately after reviewing upstream changes.
      - uses: vn7n24fzkq/github-profile-summary-cards@09ba4dde3f9b05828cb99553561db3f4ff07703f
        env:
          # Falls back to the built-in token if no PAT secret is configured.
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: "main"
          UTC_OFFSET: -4
          THEME: "github"
          AUTO_PUSH: true
